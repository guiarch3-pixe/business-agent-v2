[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-research-agent"
version = "0.2.0"
description = "Gap-driven enterprise research with LangGraph, RAG and grounded claims"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0,<2", "pydantic>=2.7,<3", "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5", "numpy>=1.26,<3", "python-dotenv>=1,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3,<6"]
ui = ["streamlit>=1.37,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
enterprise-research = "enterprise_agent.cli:main"

[tool.setuptools.packages.find]
include = ["enterprise_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
